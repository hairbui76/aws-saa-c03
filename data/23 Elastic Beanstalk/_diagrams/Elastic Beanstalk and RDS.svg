nt-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Production / dữ liệu phải sống độc lập environment → RDS ngoài EB. Tách RDS: Retain → apply, đợi → Decouple; làm cùng lúc có thể mất DB.</text></g></svg>