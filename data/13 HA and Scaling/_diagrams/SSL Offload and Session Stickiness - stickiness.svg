t-anchor="start" style="white-space: pre;" direction="ltr">② response + Set-Cookie: AWSALB</text></g><g transform="translate(30 212) rotate(0 97.16 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">③ mọi request sau kèm cookie</text></g><g transform="translate(205 318) rotate(0 47.31999999999999 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">cookie AWSALB</text></g><g transform="translate(486 314) rotate(0 40.170000000000016 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#2b8a3e" text-anchor="start" style="white-space: pre;" direction="ltr">③ luôn EC2-2</text></g><g transform="translate(320 470) rotate(0 115.505 16.25)"><text x="0" y="10.75" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">④ EC2-2 fail hoặc cookie hết hạn → dời</text><text x="0" y="27" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">sang instance khác, cookie cập nhật</text></g><g transform="translate(30 635) rotate(0 443.85 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Không stickiness: request rải đều lên mọi instance in-service → app lưu session trên instance thì user bị logout / mất giỏ hàng.</text></g><g transform="translate(30 670) rotate(0 583.65 18.75)"><text x="0" y="13.25" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">🎯 "User bị logout khi qua LB" → bật stickiness. Hỏi giải pháp scalable nhất → session ra ngoài (DynamoDB / ElastiCache). Một instance quá tải khi stickiness đang bật →</text><text x="0" y="32" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">stickiness là nguyên nhân.</text></g></svg>