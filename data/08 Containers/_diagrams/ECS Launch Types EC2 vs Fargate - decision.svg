" style="white-space: pre;" direction="ltr">Không</text></g><g transform="translate(30 560) rotate(0 477 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Chạy Docker trực tiếp trên EC2 chỉ hợp để thử nghiệm/build, không nên cho production. Đã dùng container → chọn ECS thay vì EC2 thuần.</text></g><g transform="translate(30 600) rotate(0 474.45 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">EC2 mode chỉ rẻ hơn thật khi bạn giảm được công quản trị (scaling, sizing, xử lý lỗi); fleet EC2 chạy liên tục cho tải không đều là lãng phí.</text></g></svg>