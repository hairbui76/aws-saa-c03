irection="ltr">HTTPS + header bí mật</text></g><g transform="translate(310 280) rotate(0 189.27999999999997 26.25)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">① Viewer protocol policy ép HTTPS; CloudFront chèn</text><text x="0" y="29.5" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">custom header bí mật (ví dụ X-Origin-Verify) vào request</text><text x="0" y="47" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">gửi origin</text></g><g transform="translate(990 280) rotate(0 101.22000000000003 17.5)"><text x="0" y="12.5" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">② Origin chỉ phục vụ request có</text><text x="0" y="30" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">đúng header</text></g><g transform="translate(290 410) rotate(0 222.52999999999997 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">✘ IP không thuộc CloudFront → bị chặn; không biết header → bị từ chối</text></g><g transform="translate(30 520) rotate(0 588.45 18.75)"><text x="0" y="13.25" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">HTTPS toàn tuyến nên không ai nhìn thấy header để giả mạo. (Mới hơn bài giảng: AWS-managed prefix list cho CloudFront trong SG; VPC origins cho ALB / EC2 ở private</text><text x="0" y="32" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">subnet.)</text></g></svg>