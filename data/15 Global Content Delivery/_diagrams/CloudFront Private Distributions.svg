 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">⑥ chữ ký hợp lệ → origin fetch</text></g><g transform="translate(280 560) rotate(0 152.23000000000002 16.25)"><text x="0" y="10.75" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Request không có chữ ký vào catgifs/* → bị từ chối</text><text x="0" y="27" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">(có thể dẫn về phần public để login).</text></g><g transform="translate(650 560) rotate(0 210.97500000000002 18.75)"><text x="0" y="13.25" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Private behavior chỉ chặn phía viewer. Không khóa origin</text><text x="0" y="32" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">bằng OAC / OAI thì user tải thẳng từ S3, bypass CloudFront.</text></g></svg>