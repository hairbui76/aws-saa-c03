  <rect x="0" y="0" width="1200" height="548.75" fill="#ffffff"></rect><g transform="translate(10 10) rotate(0 199.78 17.5)"><text x="0" y="25" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">gp2: mô hình I/O credit bucket</text></g><g transform="translate(12 48) rotate(0 459.68 10)"><text x="0" y="14" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr">1 credit = 1 I/O 16 KB. Bucket nạp theo baseline, bị rút khi I/O; burst tới 3,000 IOPS khi còn credit. gp3 bỏ hẳn cơ chế này.</text></g><g stroke-linecap="round" transform="translate(10 360) rotate(0 590 70)"><path d="M0.71 -0.63 C434.55 -3.81, 868.89 -2.94, 1179.82 -0.49 M1178.85 -0.78 C1180.48 29.02, 1179.44 59.78, 1178.58 141.67 M1180.43 140.13 C818.41 134.92, 457.07 135.18, 0.03 139.57 M1.09 139.29 C-0.13 112.06, -1.22 80.26, -0.77 -1.11" stroke="#868e96" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(20 366) rotate(0 67.12 10)"><text x="0" y="14" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr">Trạng thái bucket</text></g><g stroke-linecap="round" transform="translate(30 150) rotate(0 145 55)"><path d="M1.95 -1.47 L291.28 0.22 L288.35 110.64 L-1.61 111.29" stroke="none" stroke-width="0" fill="#d3f9d8"></path><path d="M-0.03 -0.25 C99.36 -0.48, 195.75 -2.77, 289.74 1.39 M-0.54 -0.47 C102.57 -1.82, 205.31 -1.41, 289.52 0.48 M291.18 -1.29 C289.17 33.03, 291.61 68.45, 288.53 111.39 M290.54 0.46 C289.57 24.86, 290.22 49.89, 289.27 110.03 M290.32 108.68 C228.88 112.59, 166.05 111.56, -1.1 108.9 M289.65 110.62 C187.33 108.36, 84.26 107.67, 0.18 109.53 M0.35 111.37 C2.62 82.9, -0.87 54.08, -1.72 -1.85 M0.9 110.54 C0.52 77.77, 0.61 46.66, 0.5 0.21" stroke="#2b8a3e" stroke-width="2" fill="none"></path></g><g transform="translate(86