Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ gp2 nhỏ chạy chậm dần sau tải nặng = cạn credit → chuyển gp3, tăng size gp2, hoặc io1/io2. gp3: mọi size đều có sẵn 3,000 IOPS / 125 MiB/s, không credit.</text></g></svg>