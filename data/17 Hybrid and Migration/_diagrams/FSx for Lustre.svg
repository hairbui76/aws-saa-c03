" direction="ltr">Object trong S3 hiện ra ngay trong file</text><text x="0" y="27.5" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#2b8a3e" text-anchor="start" style="white-space: pre;" direction="ltr">system nhưng chỉ được nạp khi client đọc</text><text x="0" y="43.75" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#2b8a3e" text-anchor="start" style="white-space: pre;" direction="ltr">lần đầu. Lustre là file system riêng, S3</text><text x="0" y="60" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#2b8a3e" text-anchor="start" style="white-space: pre;" direction="ltr">chỉ là nguồn nạp vào / xuất ra.</text></g><g transform="translate(10 570) rotate(0 409.275 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Kích thước: tối thiểu 1.2 TiB, tăng theo bước 2.4 TiB · baseline theo TiB + burst credit · backup sang S3 (0–35 ngày)</text></g><g transform="translate(10 610) rotate(0 469.8 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Đề có: Lustre · HPC · POSIX · ML / SageMaker · big data · financial modelling → FSx for Lustre. Windows / SMB → FSx for Windows.</text></g></svg>