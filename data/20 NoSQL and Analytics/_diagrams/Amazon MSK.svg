g quản broker, trả theo throughput + storage</text></g><g stroke-linecap="round" transform="translate(660 460) rotate(0 310.0 50.0)"><path d="M0 0 L620 0 L620 100 L0 100" stroke="none" stroke-width="0" fill="#ffe3e3"></path><path d="M-0.72 0.75 C156.06 -1.17, 465.3 -0.85, 619.34 -1.07 M-0.58 0.42 C153.85 0.02, 465.33 0.51, 619.76 -0.96 M619.03 -1.13 C619.2 25.29, 619.24 75.0, 619.26 100.91 M619.13 -0.58 C619.52 25.59, 620.88 74.85, 619.88 98.97 M618.92 99.08 C464.57 99.31, 154.26 100.01, 1.03 101.18 M620.58 100.02 C465.14 100.19, 156.08 99.18, 1.01 100.37 M-0.74 99.24 C-1.03 74.41, -1.03 24.06, -1.06 0.74 M-0.36 99.96 C0.11 75.88, -0.75 24.91, 1.02 -0.77" stroke="#c92a2a" stroke-width="2" fill="none"></path></g><g transform="translate(721.43 483.75) rotate(0 248.57 26.25)"><text x="248.57" y="12.25" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr">Private mặc định. Public: CHỈ provisioned, bật SAU khi tạo cluster,</text><text x="248.57" y="29.75" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr">cần subnet public, IGW…, và BẮT BUỘC authentication:</text><text x="248.57" y="47.25" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr">IAM, SCRAM hoặc mutual TLS</text></g><g transform="translate(10 590) rotate(0 647.92 9.38)"><text x="0" y="13.12" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Khác SQS: SQS xóa message sau khi xử lý, một kiểu xử lý; Kafka giữ record theo retention, nhiều consumer group đọc cùng topic, mỗi group một offset, replay được.</text></g><g transform="translate(10 620) rotate(0 675.75 9.38)"><text x="0" y="13.12" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#c92a2a" text-anchor="start" style="white-space: pre;" direction="ltr">🎯 Đã dùng Kafka (client, API), migrate / mở rộng sang AWS mà không muốn tự quản cluster Kafka → MSK. Xây mới event-driven, chỉ dùng dịch vụ native → Kinesis Data Streams.</text></g></svg>