;" direction="ltr">Cả 2 process chạy nền, định kỳ, độc lập, trên TỪNG partition</text></g><g transform="translate(30 120) rotate(0 182.91 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Item không có TTL attribute hợp lệ → không bị ảnh hưởng</text></g><g transform="translate(30 700) rotate(0 659.925 18.75)"><text x="0" y="13.25" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">🎯 "Tự động xóa item sau một thời gian", "session hết hạn", "giảm storage không tốn chi phí xóa" → TTL (epoch giây). Muốn archive trước khi xóa → TTL + Streams + Lambda → S3. Object S3</text><text x="0" y="32" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">hết hạn → S3 Lifecycle, không phải TTL.</text></g></svg>