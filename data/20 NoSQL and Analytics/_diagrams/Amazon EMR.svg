không quan trọng.</text><text x="0" y="31.88" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Cluster dài hạn: reserve / Savings Plans cho primary + core, thêm task node Spot khi cần.</text></g><g transform="translate(10 630) rotate(0 671.77 18.75)"><text x="0" y="13.12" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#c92a2a" text-anchor="start" style="white-space: pre;" direction="ltr">🎯 Hadoop, Spark ở quy mô lớn, Hive, HBase, Presto, Pig, Flink, MapReduce → EMR. Cần HDFS, full control → EC2; dữ liệu không rời on-prem → Outposts; chỉ job Spark / Hive,</text><text x="0" y="31.88" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#c92a2a" text-anchor="start" style="white-space: pre;" direction="ltr">không muốn quản compute → Serverless; đã có EKS → EKS. Chỉ "Spark" thì cẩn thận: Glue (và Athena) cũng chạy Spark.</text></g></svg>