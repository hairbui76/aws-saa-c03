lại base table (đắt)</text></g><g transform="translate(30 560) rotate(0 601.2 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Sparse index: item KHÔNG có attribute làm key của index (ngày không nắng, trạm không alarm) thì không vào index → Query/Scan index chỉ tốn capacity cho dữ liệu liên quan.</text></g><g transform="translate(30 610) rotate(0 504.45000000000005 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">🎯 Table đã tồn tại cần index mới → chỉ GSI. Cần partition key khác → GSI. Giữ PK, cần SK khác + strongly consistent → LSI. Mặc định nên chọn GSI.</text></g></svg>