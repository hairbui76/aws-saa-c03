 245) rotate(0 316.53999999999996 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Mặc định 0 (= queue thường) · message timer đặt per-message, ghi đè queue (không có trên FIFO)</text></g><g transform="translate(290 500) rotate(0 128.94 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Per-message: ChangeMessageVisibility</text></g><g transform="translate(30 590) rotate(0 599.025 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ "Chờ X phút rồi mới xử lý" (≤ 15 phút) → delay queue · bị xử lý trùng / worker crash → visibility timeout · chờ &gt; 15 phút → Step Functions Wait hoặc EventBridge schedule</text></g></svg>