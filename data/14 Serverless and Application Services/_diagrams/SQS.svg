9998 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">đọc bản gốc</text></g><g transform="translate(30 420) rotate(0 363.375 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Instance chết giữa chừng → không Delete → message tự hiện lại sau visibility timeout → worker khác xử lý</text></g><g transform="translate(30 455) rotate(0 550.875 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Message 256 KB theo khóa học (nay 1 MiB) · Retention 4 ngày, max 14 · Billing theo request (1–10 msg) · Long polling ≤ 20 s · cross-account → queue policy</text></g><g transform="translate(30 510) rotate(0 435.975 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Từ khóa decouple / asynchronous / buffer / worker pool → SQS; 1 sự kiện cần nhiều xử lý độc lập → SNS fan-out → nhiều SQS</text></g></svg>