l="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">① Sign-in</text><text x="0" y="30" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">② JWT</text></g><g transform="translate(690 138) rotate(0 35.49000000000001 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">federation</text></g><g transform="translate(50 420) rotate(0 58.94 26.25)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">③ gửi JWT</text><text x="0" y="29.5" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">⑤ temporary AWS</text><text x="0" y="47" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">credentials</text></g><g transform="translate(670 495) rotate(0 46.129999999999995 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">④ assume role</text></g><g transform="translate(290 320) rotate(0 267.05 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#2b8a3e" text-anchor="start" style="white-space: pre;" direction="ltr">⑥ gọi AWS bằng temporary credentials (quyền = quyền của role, hết hạn thì xin lại)</text></g><g transform="translate(30 600) rotate(0 538.5 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ User Pool = sign-in → JWT. Identity Pool = đổi identity (IdP token, user pool token, hoặc guest) → temporary AWS credentials = Web Identity Federation.</text></g><g transform="translate(30 645) rotate(0 428.925 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Guest không cần đăng ký → Unauthenticated role. Hàng triệu user → Cognito, KHÔNG tạo IAM user (giới hạn 5.000/account).</text></g></svg>