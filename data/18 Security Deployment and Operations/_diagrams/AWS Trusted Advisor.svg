i dùng quá 80%</text></g><g stroke-linecap="round" transform="translate(710 100) rotate(0 285.0 225.0)"><path d="M-0.67 0.61 C141.8 -1.0, 427.57 0.07, 569.62 -0.86 M1.13 -0.37 C142.98 0.82, 427.55 -0.23, 569.1 -0.25 M571.02 0.18 C569.46 112.98, 570.14 337.64, 569.34 450.77 M568.97 1.1 C569.94 113.62, 569.01 337.27, 569.24 449.98 M571.07 450.54 C428.67 450.51, 143.69 448.91, -0.3 450.83 M569.42 450.29 C428.16 450.22, 143.3 450.62, 0.42 449.27 M-0.34 449.79 C0.8 337.67, 0.23 112.63, 0.77 0.61 M0.43 449.73 C-0.07 337.42, 1.1 112.58, 0.88 -0.88" stroke="#c2255c" stroke-width="2" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(720 106) rotate(0 250.16 10.0)"><text x="0" y="14.0" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#c2255c" text-anchor="start" style="white-space: pre;" direction="ltr">Business Support+ / Enterprise Support / Unified Operations</text></g><g stroke-linecap="round" transform="translate(730 145) rotate(0 265.0 40.0)"><path d="M0 0 L530 0 L530 80 L0 80" stroke="none" stroke-width="0" fill="#fcc2d7"></path><path d="M0.21 -0.96 C131.66 0.66, 397.79 0.34, 530.48 -0.27 M-0.14 0.0 C132.18 -0.08, 398.06 -0.14, 529.19 0.28 M529.74 0.98 C529.1 20.55, 531.17 58.81, 531.14 79.48 M530.79 -0.84 C529.6 18.92, 530.67 60.34, 529.35 80.67 M529.98 81.19 C396.36 79.31, 132.17 79.85, -0.39 80.69 M530.69 80.22 C397.0 80.76, 133.25 81.09, -0.62 80.03 M0.35 79.81 C0.74 59.19, 0.53 20.27, 0.55 1.18 M-0.59 80.65 C-0.5 60.04, -0.94 19.01, -0.31 0.3" stroke="#c2255c" stroke-width="2" fill="none"></path></g><g transform="translate(787.24 176.25) rotate(0 207.76 8.75)"><text x="207.76" y="12.25" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr">Hàng trăm check, MỌI nhóm (kể cả operational excellence)</text></g><g stroke-linecap="round" transform="translate(730 255) rotate(0 265.0 50.0)"><path d="M0 0 L530 0 L530 100 L0 100" stroke="none" stroke-width="0" 