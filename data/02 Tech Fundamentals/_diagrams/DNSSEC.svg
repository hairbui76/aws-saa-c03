00000000014 8.75)"><text x="0" y="12" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">③ ký</text></g><g transform="translate(415 248) rotate(0 74.555 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">② verify bằng public ZSK</text></g><g transform="translate(973 352) rotate(0 29.120000000000005 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr">④ tin KSK</text></g><g transform="translate(30 430) rotate(0 437.1 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Resolver: RRset + RRSIG + DNSKEY → kiểm tra chữ ký. RRset bị sửa mà không có private ZSK để ký lại → chữ ký sai → phát hiện</text></g><g transform="translate(30 460) rotate(0 474.3 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Vì sao 2 khóa? Xoay ZSK chỉ cần ký lại trong zone; chỉ KSK được zone cha tham chiếu (DS) → không phải cập nhật zone cha mỗi lần đổi ZSK</text></g><g transform="translate(30 495) rotate(0 442.27500000000003 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ DNSSEC = data integrity + origin authentication, KHÔNG mã hóa truy vấn. Không sửa lỗi, chỉ báo dữ liệu có đáng tin hay không</text></g></svg>