ate(0 21.189999999999998 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">ZSK ký</text></g><g transform="translate(1140 254) rotate(0 21.190000000000055 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr">ZSK ký</text></g><g transform="translate(556 296) rotate(0 13.779999999999973 16.25)"><text x="0" y="10.75" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr">hash</text><text x="0" y="27" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr">khớp</text></g><g transform="translate(926 296) rotate(0 13.779999999999973 16.25)"><text x="0" y="10.75" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr">hash</text><text x="0" y="27" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#6741d9" text-anchor="start" style="white-space: pre;" direction="ltr">khớp</text></g><g transform="translate(20 430) rotate(0 617.175 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Private root KSK nằm trong HSM ở 2 địa điểm (California, Virginia) → chỉ dùng trong root signing ceremony (mỗi 3 tháng, ≥ 3/14 crypto officer, audit công khai) để ký root ZSK</text></g><g transform="translate(20 458) rotate(0 319.125 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">NS records chỉ để delegation DNS; DS records mới nối chain of trust DNSSEC giữa các zone</text></g><g transform="translate(20 488) rotate(0 551.475 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Route 53: KSK qua KMS customer managed key (asymmetric, us-east-1), ZSK do R53 quản lý → phải thêm DS vào zone cha (qua registrar) để hoàn tất chain</text></g></svg>