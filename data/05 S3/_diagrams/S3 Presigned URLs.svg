" style="white-space: pre;" direction="ltr">⑤ GET/PUT video TRỰC TIẾP vào S3 bằng presigned URL (không đi qua app)</text></g><g transform="translate(30 635) rotate(0 450.15 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Hạn tối đa 7 ngày (604800 s) với IAM user · console tối đa 12 giờ · CLI: aws s3 presign s3://bucket/key --expires-in 180 (giây)</text></g><g transform="translate(30 662) rotate(0 491.02500000000003 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">⚠ Vẫn tạo được URL cho object mình không có quyền hoặc không tồn tại → dùng sẽ lỗi. Qua CloudFront thì dùng CloudFront signed URL/cookie.</text></g></svg>