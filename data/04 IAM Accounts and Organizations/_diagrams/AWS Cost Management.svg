) → cost allocation tags; cảnh báo khi sắp vượt ngưỡng → AWS Budgets.</text></g><g transform="translate(10 545) rotate(0 639.98 9.38)"><text x="0" y="13.12" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Cost Explorer preferences: dữ liệu nhiều năm (38 tháng, monthly) và resource-level daily miễn phí; hourly tính phí. Tag mới phải chờ hiện ra (có khi tới 1 ngày),</text></g><g transform="translate(10 567) rotate(0 441.23 9.38)"><text x="0" y="13.12" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">activate ở management account, dùng backfill để áp cho tháng trước; Data Export đầu tiên có thể mất tới 24 giờ.</text></g></svg>