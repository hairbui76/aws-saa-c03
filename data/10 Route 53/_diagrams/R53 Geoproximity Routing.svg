13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Từ khóa "bias", "shift traffic", "expand/shrink region" → Geoproximity. Tiêu chí là khoảng cách, không phải latency.</text></g></svg>