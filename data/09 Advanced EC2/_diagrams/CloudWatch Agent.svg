e="white-space: pre;" direction="ltr">metrics</text></g><g transform="translate(730 420) rotate(0 12.285000000000025 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">logs</text></g><g transform="translate(790 598) rotate(0 211.12 8.125)"><text x="0" y="11" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">1 log file → 1 log group · 1 instance → 1 log stream (tên = instance ID)</text></g><g transform="translate(60 560) rotate(0 280.91 17.5)"><text x="0" y="12.5" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">Không có agent: CloudWatch chỉ có metric nhìn từ hypervisor (CPU, network, disk I/O,</text><text x="0" y="30" font-family="Helvetica, Segoe UI Emoji" font-size="14px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr">status check) → KHÔNG có memory, KHÔNG có disk space còn trống.</text></g><g transform="translate(30 650) rotate(0 495.975 9.375)"><text x="0" y="13" font-family="Helvetica, Segoe UI Emoji" font-size="15px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr">Mẹo: lưu config 1 lần ở Parameter Store → cả fleet (ASG) kéo về dùng chung. On-prem server cũng cài được agent (dùng IAM user credentials).</text></g></svg>