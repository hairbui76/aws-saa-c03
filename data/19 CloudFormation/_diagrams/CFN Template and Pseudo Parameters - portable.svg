ical ID&gt;-&lt;chuỗi ngẫu nhiên&gt;, luôn duy nhất. Amazon Linux 2 hết hỗ trợ giữa 2026: nay dùng path …/al2023-ami-kernel-default-x86_64</text></g></svg>